services:
  web:
    build: .
    container_name: django_server
    restart: always
    volumes:
      - .:/app
      - static_volume:/app/static
    ports:
      - "8000:8000"
    env_file: .env
    depends_on:
      - db

  db:
    image: postgres:15
    container_name: postgres_db
    restart: always
    env_file: .env
    volumes:
      - pg_data:/var/lib/postgresql/data

  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    ports:
      - "80:80"
      - "8080:80"
    volumes:
      - static_volume:/var/www/html/static
    depends_on:
      - web

volumes:
  pg_data:
  static_volume:
